# vim:ft=conf

set -g pane-active-border-style 'fg=#cba6f7,bg=default'
set -g pane-border-style 'fg=#45475a,bg=default'

set -wg window-active-style bg=terminal
set -wg window-style bg=terminal

# ====== STATUS BAR START ======
# Catppuccin Mocha palette
set -g @ctp_base "#1e1e2e"
set -g @ctp_surface0 "#313244"
set -g @ctp_surface1 "#45475a"
set -g @ctp_text "#cdd6f4"
set -g @ctp_crust "#11111b"
set -g @ctp_mauve "#cba6f7"
set -g @ctp_lavender "#b4befe"
set -g @ctp_sapphire "#74c7ec"
set -g @ctp_blue "#89b4fa"
set -g @ctp_peach "#fab387"

set -g status-style "fg=#{@ctp_text},bg=terminal"
set -g status-justify absolute-centre # Position of window list
set -g status-left-length 60
set -g status-right-length 60

# Left module (session name)
set -g @session-left-sep "#[fg=#{@ctp_lavender},bg=#{@ctp_base}]"
set -g @session-right-sep "#[fg=#{@ctp_lavender},bg=#{@ctp_base}]"
set -g status-left-style "fg=#{@ctp_crust},bg=#{@ctp_lavender}"
set -g status-left "#[fg=#{@ctp_lavender},bg=terminal]#[fg=#{@ctp_crust},bg=#{@ctp_lavender}]#{?client_prefix,,} #S#{?#{==:#{pane_current_command},ssh}, 󰒋 #(tmux display-message -p -t '#{pane_id}' '#{pane_title}' | sed -E 's/^[^@]*@//; s/:.*$//'),#{?#{pane_ssh_connected}, 󰒋 #H#{?#{pane_ssh_port},:#{pane_ssh_port},},}}#[fg=#{@ctp_lavender},bg=terminal]" # Session / SSH target

# Window list module
set -g @window-left-sep "#[fg=#{@ctp_mauve},bg=terminal]"
set -g @window-right-sep "#[fg=#{@ctp_mauve},bg=terminal]"
set -g window-status-current-style "fg=#{@ctp_mauve},bg=terminal"
set -g window-status-current-format "#[fg=#{@ctp_mauve},bg=terminal]#[fg=#{@ctp_crust},bg=#{@ctp_mauve}]#{?#{==:#I,0},⓪,#{?#{==:#I,1},❶,#{?#{==:#I,2},❷,#{?#{==:#I,3},❸,#{?#{==:#I,4},❹,#{?#{==:#I,5},❺,#{?#{==:#I,6},❻,#{?#{==:#I,7},❼,#{?#{==:#I,8},❽,#{?#{==:#I,9},❾,#{?#{==:#I,10},❿,#I}}}}}}}}}}} #W#[fg=#{@ctp_mauve},bg=terminal]"
set -g window-status-style "fg=#{@ctp_text},bg=terminal"
set -g window-status-format "#[fg=#{@ctp_surface0},bg=terminal]#[fg=#{@ctp_text},bg=#{@ctp_surface0}]#{?#{==:#I,0},⓪,#{?#{==:#I,1},❶,#{?#{==:#I,2},❷,#{?#{==:#I,3},❸,#{?#{==:#I,4},❹,#{?#{==:#I,5},❺,#{?#{==:#I,6},❻,#{?#{==:#I,7},❼,#{?#{==:#I,8},❽,#{?#{==:#I,9},❾,#{?#{==:#I,10},❿,#I}}}}}}}}}}} #W#[fg=#{@ctp_surface0},bg=terminal]"

# Right modules (path, time)
set -g @module-left-sep "#[fg=#{@ctp_peach},bg=terminal]"
set -g @module-right-sep "#[fg=#{@ctp_peach},bg=terminal]"
set -g status-right-style "fg=#{@ctp_peach},bg=terminal"
set -g status-right "#[fg=#{@ctp_peach},bg=terminal]#[fg=#{@ctp_crust},bg=#{@ctp_peach}] #(echo '#{pane_current_path}' | sed 's|^$HOME|~|' | awk -F/ '{print \$NF}')#[fg=#{@ctp_peach},bg=terminal]" # CWD
# set -ga status-right "#{@module-left-sep}#[default]󰃭 %Y-%m-%d " # Date
# set -ga status-right "#[default] %H:%M#{@module-right-sep}" # Time
# ====== STATUS BAR END ======
