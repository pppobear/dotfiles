{{- /* chezmoi:modify-template */ -}}
{{- $lines := .chezmoi.stdin | splitList "\n" -}}
{{- $remainingLines := slice $lines (min (len $lines) 20) -}}
{{- $tail := join "\n" $remainingLines -}}
personality = "pragmatic"
approvals_reviewer = "guardian_subagent"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
# model_provider = "apirouter"

mcp_oauth_credentials_store = "file"

notify = ["/Users/enoch/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]
base_url = "http://127.0.0.1:15721/v1"
wire_api = "responses"
experimental_bearer_token = "PROXY_MANAGED"
{{- if not (contains "[model_providers.apirouter]" $tail) }}

[model_providers.apirouter]
name = "OpenAI via OMP LiteLLM"
base_url = "https://litellm.wenext.technology/v1"
experimental_bearer_token = {{ (rbwFields "litellm.wenext.technology").api_key.value | quote }}
wire_api = "responses"
supports_websockets = false
{{- end }}
{{- if not (contains "[marketplaces.openviking-plugins-local]" $tail) }}

[marketplaces.openviking-plugins-local]
source_type = "local"
source = "/Users/enoch/.codex/openviking-plugins-local-marketplace"
{{- end }}
{{- if not (contains "[plugins.\"openviking-memory@openviking-plugins-local\"]" $tail) }}

[plugins."openviking-memory@openviking-plugins-local"]
enabled = true
{{- end }}
{{ $tail }}
